name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Ordner (android/ios/web) erzeugen
        run: |
          flutter create . --project-name zikir_app --org de.zikir --platforms android,ios,web
          rm -f test/widget_test.dart

      - name: App-Name "Zikir" setzen
        run: sed -i 's/android:label="zikir_app"/android:label="Zikir"/' android/app/src/main/AndroidManifest.xml

      - name: Signatur-Schlüssel bereitstellen
        run: |
          if [ -n "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            KS="$RUNNER_TEMP/upload.jks"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in ci/upload-keystore.enc -out "$KS" \
              -pass env:UPLOAD_KEYSTORE_PASSWORD
            echo "Prüfsumme Schlüssel: $(sha256sum "$KS" | cut -c1-16) (erwartet: afef26d56245f721)"
            keytool -list -keystore "$KS" -storepass android | grep -i androiddebugkey
            UPLOAD_KEYSTORE_FILE="$KS" python3 ci/patch_signing.py
            echo "SIGNED=play" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.android
            cp ci/debug.keystore ~/.android/debug.keystore
            echo "SIGNED=local" >> "$GITHUB_ENV"
            echo "Kein Secret UPLOAD_KEYSTORE_PASSWORD gefunden – lokaler Schlüssel, nur APK."
          fi

      - name: Abhängigkeiten laden
        run: flutter pub get

      - name: App-Icon erzeugen
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Tests
        run: flutter test

      - name: APK bauen
        run: flutter build apk --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"

      - name: App-Bundle (AAB) für Play Store bauen
        if: env.SIGNED == 'play'
        run: flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"

      - name: Signatur prüfen (kein Debug-Schlüssel im Play-Bundle)
        if: env.SIGNED == 'play'
        run: |
          OWNER=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 "Owner")
          echo "Signiert von: $OWNER"
          if echo "$OWNER" | grep -q "Android Debug"; then
            echo "::error::AAB ist mit Debug-Schlüssel signiert – Play Store lehnt das ab."
            exit 1
          fi

      - name: Dateien umbenennen
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/zikir-app-v$VERSION_NAME.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/zikir-app-v$VERSION_NAME.aab"
          fi
          ls -la dist

      - name: Dateien als Download ablegen (Actions-Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: zikir-app-v${{ env.VERSION_NAME }}
          path: dist/*

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Zikir v${{ env.VERSION_NAME }}
          files: dist/*
